<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#171b27">
    <meta name="description" content="CF Chef — Your Talent. Your Kitchen. Your Future.">

    <title>CF Chef | Welcome</title>

    <link rel="preload" href="./assets/img/logo.png" as="image">
    <link rel="stylesheet" href="./index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <main class="loader" id="loader">

        <div class="side-line-orbit">
            <div class="side-line top"></div>
            <div class="side-line bottom"></div>
            <div class="side-line left"></div>
            <div class="side-line right"></div>
        </div>

        <div class="side-line-orbit reverse">
            <div class="side-line top"></div>
            <div class="side-line bottom"></div>
            <div class="side-line left"></div>
            <div class="side-line right"></div>
        </div>

        <div class="ambient ambient-cyan"></div>
        <div class="ambient ambient-violet"></div>
        <div class="ambient ambient-blue"></div>

        <div class="grid-overlay"></div>
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>

        <section class="glass-card" aria-label="CF Chef loading screen">

            <div class="glass-highlight"></div>

            <div class="logo-area">

                <div class="logo-halo"></div>

                <div class="logo-ring ring-one"></div>
                <div class="logo-ring ring-two"></div>

                <div class="logo-shell">

                    <img
                        src="./assets/img/logo.png"
                        alt="CF Chef"
                        class="logo"
                        id="brandLogo"
                    >

                    <div class="logo-fallback" id="logoFallback" aria-hidden="true">
                        CF
                    </div>

                </div>

            </div>

            <div class="brand">

                <p class="eyebrow">
                    <span class="status-dot"></span>
                    WELCOME TO YOUR NEXT CHAPTER
                </p>

                <h1>CF <span>CHEF</span></h1>

                <p class="tagline">
                    Your Talent.<br>
                    <span>Your Kitchen. Your Future.</span>
                </p>

            </div>

            <div class="glass-divider">
                <span></span>
            </div>

            <div class="loading-area">

                <div class="loading-heading">

                    <span id="loadingText">Preparing your kitchen</span>

                    <span id="loadingPercent">0%</span>

                </div>

                <div
                    class="loading-track"
                    role="progressbar"
                    aria-label="Loading"
                    aria-valuemin="0"
                    aria-valuemax="100"
                    aria-valuenow="0"
                    id="progressTrack"
                >

                    <div class="loading-progress" id="loadingProgress">
                        <span class="progress-shine"></span>
                    </div>

                </div>

                <div class="loading-footer">

                    <span class="loading-indicator"></span>

                    <span id="footerStatus">
                        CRAFTING SOMETHING EXCEPTIONAL
                    </span>

                </div>

            </div>

        </section>

        <footer class="footer">

            <span class="footer-line"></span>

            <span>MADE FOR THE LOVE OF COOKING</span>

            <span class="footer-star">✦</span>

            <span>CF CHEF</span>

            <span class="footer-line"></span>

        </footer>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
        defer>
    </script>

    <script src="./supabase-config.js" defer></script>

    <script src="./index.js" defer></script>

</body>

</html>
